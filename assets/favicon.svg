  <circle cx="16" cy="16" r="14" fill="none" stroke="#2E6417" stroke-width="2" />
  <path d="M8.8 12.6h14.4l-1.9 9.6a6 6 0 0 1-10.6 0z" fill="#A85B33" />
  <ellipse cx="16" cy="12.6" rx="7.2" ry="2.4" fill="#FFF8EF" />
  <path d="M10.6 12.3a5.4 1.5 0 0 1 10.8 0" fill="none" stroke="#E7CDAB" stroke-width="0.7" />
</svg>

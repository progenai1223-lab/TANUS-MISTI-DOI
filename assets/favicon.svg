<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Tanu's">
  <title>Tanu's</title>
  <!-- The crest reduced to what still reads at 16 pixels: the green ring and
       the apricot field of the client's own logo, with a bhaar of set doi in
       place of the drawn tree. No lettering — a "T" at this size is nobody's. -->
